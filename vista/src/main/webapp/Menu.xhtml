<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Asignación - SAUAP</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #202020;
            min-height: 100vh;
        }

        .barra-superior {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;

            background-color: #075c66;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;

            color: white;
            font-size: 28px;
        }

        .logo img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .usuario {
            color: white;
            font-size: 18px;

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .icono-usuario {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .icono-salir {
            width: 20px;
            height: 20px;
            object-fit: contain;

            margin-left: 25px;
        }

        .flecha {
            font-size: 16px;
            margin-left: 3px;
        }

        .menu-lateral {
            position: fixed;
            top: 80px;
            left: 0;

            width: 190px;
            height: calc(100vh - 80px);

            background-color: #075c66;

            padding-top: 25px;
        }


        .menu-item {
            display: flex;
            align-items: center;

            gap: 10px;

            width: 100%;

            color: white;
            text-decoration: none;

            font-size: 16px;

            padding: 18px 12px;

            white-space: nowrap;
        }


        .menu-item img {
            width: 20px;
            height: 20px;

            object-fit: contain;

            flex-shrink: 0;
        }


        .menu-item:hover {
            background-color: #064c55;
        }

        .contenido {
            position: absolute;

            top: 80px;
            left: 190px;
            right: 0;

            min-height: calc(100vh - 80px);

            background-color: white;

            padding: 25px 26px;

            overflow-x: hidden;
        }

        .titulo {
            height: 84px;

            background-color: #d9d9d9;

            border-radius: 13px;

            display: flex;
            align-items: center;

            padding-left: 30px;

            gap: 28px;

            margin-bottom: 24px;
        }


        .titulo img {
            width: 55px;
            height: 55px;

            object-fit: contain;
        }


        .titulo h1 {
            font-size: 28px;
            font-weight: normal;
        }

        .asignacion {
            background-color: #d9d9d9;

            border-radius: 13px;

            min-height: 357px;

            padding: 14px 30px 30px;
        }


        .subtitulo {
            font-size: 18px;

            margin-bottom: 8px;
        }


        .formulario {
            display: flex;

            align-items: flex-end;
            justify-content: center;

            gap: 45px;

            flex-wrap: wrap;

            margin-top: 25px;
        }

        .campo {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .campo label {
            font-size: 14px;
        }

        .campo input,
        .campo select {
            height: 32px;

            border: none;

            border-radius: 18px;

            background-color: white;

            padding: 0 15px;

            outline: none;

            font-family: Georgia, 'Times New Roman', serif;

            font-size: 14px;
        }

        .profesor input {
            width: 220px;
        }

        .materia input {
            width: 220px;
        }

        .tipo select {
            width: 150px;
        }

        .horas input {
            width: 80px;
        }

        .boton-asignar {
            display: block;

            margin: 35px auto 0;

            width: 125px;
            height: 32px;

            border: none;

            border-radius: 18px;

            background-color: #74116f;

            color: white;

            font-family: Georgia, 'Times New Roman', serif;

            font-size: 14px;

            cursor: pointer;

            transition: 0.2s;
        }



        .boton-asignar:hover {
            background-color: #5c0d58;

            transform: scale(1.03);
        }

        .boton2:active {
            background-color: #74116f;
            color: white;
        }

        .materias-asignadas {
            background-color: white;

            border-radius: 13px;

            height: 143px;

            margin: 51px auto 0;

            width: 78%;

            padding: 12px;
        }


        .materias-asignadas h3 {
            text-align: center;

            font-size: 12px;

            font-weight: normal;

            margin-bottom: 15px;
        }

        .tabla {
            width: 100%;

            border-collapse: collapse;

            font-size: 12px;
        }


        .tabla th {
            background-color: #075c66;

            color: white;

            padding: 5px;
        }


        .tabla td {
            padding: 5px;

            text-align: center;

            border-bottom: 1px solid #ddd;
        }

        @media (max-width: 800px) {

            .menu-lateral {
                width: 100px;
            }


            .menu-item {
                font-size: 0;

                justify-content: center;
            }


            .menu-item img {
                width: 20px;
                height: 20px;
            }


            .contenido {
                left: 107px;
            }


            .formulario {
                gap: 15px;
            }


            .materias-asignadas {
                width: 95%;
            }

        }
        .boton2 {
            background-color: #D9D9D9;
            color:#000000;
            border: none;
            padding: 15px 125px;
            font-size: 30px;
            border-radius: 40px;
            font-family: "Inria Serif", serif;
        }
        .section {
            background-color: #ffffff;
            color: #000000;
            font-size: 40px;
            font-family: "Inria Serif", serif;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10vh;
        }

        .registros{
            display: flex;
            flex-direction: column;
            gap: 3vh;
            justify-content: center;
            align-items: center;
        }
        .consultar{
            display: flex;
            flex-direction: column;
            gap: 3vh;
            justify-content: center;
            align-items: center;
        }

        .main{
            display: flex;
            padding-left: 190px;
        }
        .boton{

        }
    </style>

</head>


<body>

<header class="barra-superior">

    <div class="logo">

        <img
                src="resources/iconlogo.png"
                alt="Logo SAUAP"
        />

        <span>SAUAP</span>

    </div>


    <div class="usuario">

        <img
                src="resources/iconuserblanco.png"
                alt="Usuario"
                class="icono-usuario"
        />

        <span>Administrador</span>



        <img
                src="resources/iconsalir.png"
                alt="Cerrar sesión"
                class="icono-salir"
        />

    </div>

</header>
<main class="main">
    <aside class="menu-lateral">


        <a href="#" class="menu-item">

            <img
                    src="resources/iconInicio.png"
                    alt="Inicio"
            />

            <span>INICIO</span>

        </a>


        <a href="#" class="menu-item">

            <img
                    src="resources/iconuserblanco.png"
                    alt="Profesores"
            />

            <span>PROFESORES</span>

        </a>


        <a href="#" class="menu-item">

            <img
                    src="resources/iconmateria.png"
                    alt="Materias"
            />

            <span>MATERIAS</span>

        </a>


        <a href="#" class="menu-item">

            <img
                    src="resources/iconoasig.png"
                    alt="Asignación"
            />

            <span>ASIGNACIÓN</span>

        </a>


    </aside>

    <section class="section">
        <div class="registros">
            <p>Registros</p>
            <div class="boton">
                <button class="boton2">Maestro</button>
                <button class="boton2">Materia</button>
            </div>
        </div>
        <div class="consultar">
            <p>Consultar</p>
            <div class="boton">
                <button class="boton2">Maestro</button>
                <button class="boton2">Materia</button>
            </div>
        </div>
        <button class="boton2">Asignar Materia</button>
    </section>

</main>
</body>

</html>
