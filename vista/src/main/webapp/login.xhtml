<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SAUAP - Iniciar sesión</title>

    <style>
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: #F4F6F6;


            background-image: url("#{resource['fondo.png']}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        .izquierda {
            text-align: center;
        }


        .logo {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .sauap {
            color: #0F4C52;
            font-size: 96px;
            font-family: "Inria Serif", serif;
        }

        .descripcion {
            color: #172325;
            font-size: 24px;
            font-family: "Inria Serif", serif;
            max-width: 500px;
        }

        .login {
            width: 637px;
            min-height: 567px;
            background: #38727D;
            border-radius: 47px;
            box-shadow: 12px 23px 7px rgba(0,0,0,0.25);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenido {
            width: 556px;
            text-align: center;
        }

        .titulo {
            color: #172325;
            font-size: 64px;
            font-family: "Inria Serif", serif;
            margin-bottom: 60px;
        }

        .campo {
            margin-bottom: 25px;
            position: relative;
        }

        .campo input {
            width: 100%;
            height: 60px;
            box-sizing: border-box;
            border-radius: 100px;
            border: none;
            background: #D9D9D9;
            padding: 0 60px;
            font-size: 18px;
        }

        .icono {
            position: absolute;
            left: 20px;
            top: 15px;
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .icono-ojo {
            position: absolute;
            right: 20px;
            top: 15px;
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .recordar {
            text-align: left;
            margin: 15px 0 25px 20px;
            color: #172325;
            font-family: "Inria Serif", serif;
            font-size: 15px;
        }

        .boton {
            background: #64165F !important;
            border: none !important;
            border-radius: 28px !important;
            padding: 12px 35px !important;
        }

        .registrarse {
            margin-top: 30px;
            color: #172325;
            font-size: 24px;
        }

    </style>
</h:head>


<h:body>

    <div class="pagina">


        <div class="izquierda">


            <h:graphicImage
                    name="logo.png"
                    styleClass="logo"/>

            <div class="sauap">
                SAUAP
            </div>

            <div class="descripcion">
                Sistema de Asignación de
                <br/>
                Unidades de Aprendizaje a los Profesores
            </div>

        </div>

        <div class="login">

            <div class="contenido">

                <div class="titulo">
                    SIGN IN
                </div>

                <h:form>


                    <div class="campo">

                        <h:graphicImage
                                name="iconUser.png"
                                styleClass="icono"/>

                        <p:inputText
                                value="#{loginHelper.idProfesor}"
                                placeholder="Usuario:"/>

                    </div>


                    <div class="campo">

                        <h:graphicImage
                                name="iconLlave.png"
                                styleClass="icono"/>

                        <p:password
                                value="#{loginHelper.password}"
                                placeholder="Contraseña:"/>

                        <h:graphicImage
                                name="iconOjo.png"
                                styleClass="icono-ojo"/>

                    </div>

                    <!-- RECORDARME -->
                    <div class="recordar">

                        <p:selectBooleanCheckbox
                                value="#{loginHelper.recordarme}"/>

                        Recordarme

                    </div>

                    <!-- Falta conectar -->
                    <p:commandButton
                            value="Entrar"
                            action="#{loginHelper.login}"
                            styleClass="boton"/>

                </h:form>


                <!-- esta como texto, tiene que ser boton -->
                <div class="registrarse">
                    Registrarse
                </div>

            </div>

        </div>

    </div>

</h:body>

</html>
