<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrar Profesor - SAUAP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #202020;
            min-height: 100vh;
        }

        .barra-superior {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #075c66;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            font-size: 28px;
        }

        .logo img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .usuario {
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icono-usuario {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .icono-salir {
            width: 20px;
            height: 20px;
            object-fit: contain;
            margin-left: 25px;
        }

        .menu-lateral {
            position: fixed;
            top: 80px;
            left: 0;
            width: 190px;
            height: calc(100vh - 80px);
            background-color: #075c66;
            padding-top: 25px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 18px 12px;
            white-space: nowrap;
        }

        .menu-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .menu-item:hover {
            background-color: #064c55;
        }

        .main {
            display: flex;
            padding-left: 190px;
            padding-top: 80px;
        }

        .section {
            background-color: #ffffff;
            color: #000000;
            font-size: 40px;
            font-family: "Inria Serif", serif;
            flex: 1;
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .SAUAP {
            color: #064c55;
        }

        .ADtext {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .campos {
            font-size: 24px;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campos p {
            margin-top: 10px;
        }

        .input {
            width: 700px;
            height: 35px;
            color: #000000;
            background-color: rgb(159, 159, 159);
            border: none;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 20px;
            font-family: "Inria Serif", serif;
            outline: none;
        }

        .boton2 {
            background-color: #D9D9D9;
            color: #000000;
            border: none;
            padding: 10px 75px;
            font-size: 20px;
            border-radius: 40px;
            font-family: "Inria Serif", serif;
            margin-top: 30px;
            cursor: pointer;
        }

        .boton2:active {
            background-color: #74116f;
            color: white;
        }

        @media (max-width: 800px) {
            .menu-lateral {
                width: 100px;
            }

            .menu-item {
                font-size: 0;
                justify-content: center;
            }

            .main {
                padding-left: 100px;
            }

            .input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header class="barra-superior">
    <div class="logo">
        <img src="resources/iconlogo.png" alt="Logo SAUAP"/>
        <span>SAUAP</span>
    </div>

    <div class="usuario">
        <img src="resources/iconuserblanco.png" alt="Usuario" class="icono-usuario"/>
        <span>Administrador</span>
        <img src="resources/iconsalir.png" alt="Cerrar sesión" class="icono-salir"/>
    </div>
</header>

<main class="main">
    <aside class="menu-lateral">
        <a href="menu.xhtml" class="menu-item">
            <img src="resources/iconInicio.png" alt="Inicio"/>
            <span>INICIO</span>
        </a>

        <a href="profesores.xhtml" class="menu-item">
            <img src="resources/iconuserblanco.png" alt="Profesores"/>
            <span>PROFESORES</span>
        </a>

        <a href="materia.xhtml" class="menu-item">
            <img src="resources/iconmateria.png" alt="Materias"/>
            <span>MATERIAS</span>
        </a>

        <a href="asignar.xhtml" class="menu-item">
            <img src="resources/iconoasig.png" alt="Asignación"/>
            <span>ASIGNACIÓN</span>
        </a>

        <a href="ConsultarProfe.html" class="menu-item">
            <img src="resources/iconoasig.png" alt="Consultas"/>
            <span>CONSULTAS</span>
        </a>
    </aside>

    <section class="section">
        <h1 class="SAUAP">SAUAP</h1>
        <p class="ADtext">Sistema de Asignación de Unidades de Aprendizaje a los Profesores</p>

        <form class="campos">
            <p>Nombre(s):</p>
            <input type="text" name="nombre" class="input" required/>

            <p>Apellido Paterno:</p>
            <input type="text" name="apellidoPaterno" class="input" required/>

            <p>Apellido Materno:</p>
            <input type="text" name="apellidoMaterno" class="input" required/>

            <p>RFC:</p>
            <input type="text" name="rfc" class="input" required/>

            <div style="text-align: center;">
                <button type="submit" class="boton2">Registrar</button>
            </div>
        </form>
    </section>
</main>

</body>
</html>
