<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar profesor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
        }

        .barra-superior {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #075c66;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-family: Georgia, serif;
            font-size: 24px;
        }

        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .usuario {
            color: #ffffff;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-lateral {
            position: fixed;
            top: 70px;
            left: 0;
            width: 220px;
            height: calc(100vh - 70px);
            background-color: #075c66;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 6px;
        }

        .menu-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .menu-item img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .contenido {
            margin-top: 70px;
            margin-left: 220px;
            min-height: calc(100vh - 70px);
            background-color: #f2f4f4;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo {
            font-family: Arial, sans-serif;
            font-size: 70px;
            color: #075c66;
            font-weight: normal;
        }

        .subtitulo {
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: #555555;
            margin-top: 8px;
            margin-bottom: 40px;
            text-align: center;
        }

        .formulario {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo label {
            font-size: 14px;
            color: #333333;
        }

        .campo input {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            background-color: #d8d8d8;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
        }

        .boton {
            align-self: center;
            margin-top: 20px;
            width: 130px;
            height: 38px;
            border: none;
            border-radius: 19px;
            background-color: #612c53;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header class="barra-superior">
    <div class="logo">
        <img src="resources/iconlogo.png" alt="Logo"/>
        <span>SAUAP</span>
    </div>
    <div class="usuario">
        <span>Administrador</span>
    </div>
</header>

<aside class="menu-lateral">
    <a href="menu.html" class="menu-item">
        <img src="resources/iconInicio.png" alt="Inicio"/>
        <span>INICIO</span>
    </a>

    <a href="Profesor.html" class="menu-item">
        <img src="resources/iconuserblanco.png" alt="Profesores"/>
        <span>PROFESORES</span>
    </a>

    <a href="menuDesarrollo.html" class="menu-item">
        <img src="resources/iconmateria.png" alt="Materias"/>
        <span>MATERIAS</span>
    </a>

    <a href="Asignacion.html" class="menu-item">
        <img src="resources/iconasig.png" alt="Asignación"/>
        <span>ASIGNACIÓN</span>
    </a>
</aside>

<main class="contenido">
    <h1 class="titulo">SAUAP</h1>
    <p class="subtitulo">Sistema de Asignación de Unidades de Aprendizaje a los Profesores</p>

    <form class="formulario">
        <div class="campo">
            <label for="nombre">Nombre(s):</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
            <label for="apellidoPaterno">Apellido Paterno:</label>
            <input type="text" id="apellidoPaterno" name="apellidoPaterno" required>
        </div>

        <div class="campo">
            <label for="apellidoMaterno">Apellido Materno:</label>
            <input type="text" id="apellidoMaterno" name="apellidoMaterno" required>
        </div>

        <div class="campo">
            <label for="rfc">RFC:</label>
            <input type="text" id="rfc" name="rfc" required>
        </div>

        <button type="submit" class="boton">Registrar</button>
    </form>
</main>

</body>
</html>
